<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | Minimakers</title>
    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-main container">
            <div class="brand-container">
                <h1 class="brand-title">Minimakers</h1>
                <p class="brand-subtitle">Reviews</p>
            </div>
            <nav class="header-nav">
                <a href="index.html" class="nav-back-link">&larr; Terug naar de winkel</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 50px 20px 80px 20px;">
        <section class="review-form-container" style="max-width: 800px; margin: 0 auto 40px;">
            <h2>Schrijf een review</h2>
            <form id="review-form">
                <label for="review-name">Naam:</label><br>
                <input type="text" id="review-name" required placeholder="Jouw naam"><br><br>

                <label for="review-rating">Beoordeling:</label><br>
                <select id="review-rating" required>
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                    <option value="2">⭐⭐ (2/5)</option>
                    <option value="1">⭐ (1/5)</option>
                </select><br><br>

                <label for="review-text">Jouw review:</label><br>
                <textarea id="review-text" rows="4" required placeholder="Wat vind je van het product?"></textarea><br><br>

                <button type="submit">Plaats review</button>
            </form>
        </section>

        <section class="reviews-display-container" style="max-width: 800px; margin: 0 auto;">
            <h2>Wat anderen zeggen</h2>
            <div id="reviews-list"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Vragen of maatwerk? Mail naar <a href="mailto:minimakers3dprint@gmail.com">minimakers3dprint@gmail.com</a></p>
            <p class="copyright">&copy; 2026 Minimakers. Alle rechten voorbehouden.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
